[tool.pytest.ini_options]
asyncio_mode       = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths          = ["tests"]
python_files       = ["test_*.py"]
python_classes     = ["Test*"]
python_functions   = ["test_*"]
addopts            = "-v --tb=short"

# Marks
markers = [
    "asyncio: marks tests as async",
    "frontend: marks tests that require a running server + browser (Playwright)",
]
